seed: 42
method: lora_ga

model:
  model_name_or_path: roberta-base
  task_type: SEQ_CLS
  num_labels: 2
  target_modules:
    - query
    - value

data:
  dataset_name: glue
  dataset_config_name: rte
  max_length: 128
  calibration_size: 32

lora:
  rank: 8
  alpha: 16
  dropout: 0.0
  bias: none
  use_rslora: false
  adapter_name: default

lora_ga:
  gamma: 16.0
  calibration_batches: 1

rebase:
  enabled: false

optimizer:
  learning_rate: 1.0e-4
  weight_decay: 0.0

training:
  output_dir: outputs/aliyun_a10/roberta_rte_lora_ga
  train_batch_size: 16
  eval_batch_size: 64
  dataloader_num_workers: 0
  pin_memory: true
  persistent_workers: false
  gradient_accumulation_steps: 1
  num_epochs: 1
  max_steps:
  log_every_steps: 10
  eval_every_steps: 20
  use_amp: true
  amp_dtype: bfloat16
  allow_tf32: true
