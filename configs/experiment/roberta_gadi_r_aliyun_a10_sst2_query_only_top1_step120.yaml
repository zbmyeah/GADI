seed: 42
method: gadi_r

model:
  model_name_or_path: roberta-base
  task_type: SEQ_CLS
  num_labels: 2
  target_modules:
    - query
    - value

data:
  dataset_name: glue
  dataset_config_name: sst2
  max_length: 128
  calibration_size: 32

lora:
  rank: 8
  alpha: 16
  dropout: 0.0
  bias: none
  use_rslora: false
  adapter_name: default

lora_ga:
  gamma: 16.0
  calibration_batches: 1

rebase:
  enabled: true
  interval_steps: 120
  warmup_steps: 120
  max_rebases: 1
  drift_threshold: 0.03
  topk_layers: 1
  selection_strategy: query_only
  calibration_batches: 8
  use_residual_gradient: true
  gradient_mix: 0.5
  calibration_eval_mode: true
  reset_optimizer_state: false

optimizer:
  learning_rate: 1.0e-4
  weight_decay: 0.0

training:
  output_dir: outputs/aliyun_a10/roberta_sst2_gadi_r_query_only_top1_step120
  train_batch_size: 16
  eval_batch_size: 128
  dataloader_num_workers: 0
  pin_memory: true
  persistent_workers: false
  gradient_accumulation_steps: 1
  num_epochs: 1
  max_steps:
  log_every_steps: 100
  eval_every_steps: 200
  use_amp: true
  amp_dtype: bfloat16
  allow_tf32: true
